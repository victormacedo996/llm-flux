[project]
name = "llm-flux"
version = "0.1.0"
description = "Dissertation methodology framework for LLM compression research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Macedo", email = "victormacedo996@gmail.com"}]

dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "torch>=2.3",
    "transformers>=4.42",
    "datasets>=2.20",
    "peft>=0.12",
    "psutil>=6.0",
    "loguru>=0.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
gptq         = ["auto-gptq>=0.7"]
awq          = ["autoawq>=0.2"]
bitsandbytes = ["bitsandbytes>=0.43"]
cli          = ["typer>=0.12"]
dev          = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
modelforge = "modelforge.cli:app"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
